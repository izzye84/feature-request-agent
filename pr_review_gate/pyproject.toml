[project]
name = "pr-review-gate"
version = "0.1.0"
description = "Cursor SDK PR review gate, run from .github/workflows/pr-review.yml"
requires-python = ">=3.10"
dependencies = [
    "cursor-sdk==1.3.1",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
