# PR review gate (Cursor SDK)
# ===========================
# Every non-draft PR from this repo gets a Cursor cloud-agent review. The
# agent only *recommends*; pr_review_gate/review_policy.py decides, and
# pr_review_gate/review_pr.py publishes the comment / approval / label.
#
#   pull_request ─▶ review_pr.py (base-branch code) ─▶ Cursor cloud agent ─▶ policy ─▶ comment + approve | label
#
# Security notes:
#   * Checks out the BASE commit, so a PR cannot rewrite the policy that
#     judges it (same idea as Bugbot reading config from the base branch).
#   * `pull_request` (not `pull_request_target`): fork PRs get no secrets and
#     are skipped by the `if:` below. Cursor Automations doesn't support fork
#     PRs either.
#   * Untrusted PR text is never interpolated into `run:`; values reach the
#     script through `env`.
#   * Actions pinned to commit SHAs; token scoped to this job.
#
# Setup: secret CURSOR_API_KEY; optional variables CURSOR_MODEL_ID,
# CURSOR_MODEL_PARAMS (e.g. "reasoning_effort=high"), PR_REVIEWER (a
# collaborator login). To let the bot approve, enable Settings → Actions →
# "Allow GitHub Actions to create and approve pull requests".

name: PR review gate

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

concurrency:
  group: pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
    defaults:
      run:
        working-directory: pr_review_gate
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          enable-cache: true
          cache-dependency-glob: pr_review_gate/uv.lock

      # Installs only the gate's own dependency (cursor-sdk), not Dagster.
      - run: uv sync --frozen --no-dev

      - name: Review PR with a Cursor cloud agent
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CURSOR_MODEL_ID: ${{ vars.CURSOR_MODEL_ID }}
          CURSOR_MODEL_PARAMS: ${{ vars.CURSOR_MODEL_PARAMS }}
          PR_REVIEWER: ${{ vars.PR_REVIEWER }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: >-
          uv run --no-sync python review_pr.py
          --repo-url "https://github.com/$GITHUB_REPOSITORY"
          --pr-url "$PR_URL"
          --pr-number "$PR_NUMBER"
          --idempotency-key "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          --publish
